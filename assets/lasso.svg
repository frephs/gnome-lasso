<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Adwaita Window Gradients -->
    <linearGradient id="win_front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f5f4"/>
    </linearGradient>

    <linearGradient id="win_back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f5f4"/>
      <stop offset="100%" stop-color="#deddda"/>
    </linearGradient>

    <linearGradient id="badge_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>

    <!-- Essential Window Shadow -->
    <filter id="card_shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Lasso Semi-Transparent Dual Shadow (Ambient & Accent) -->
    <filter id="lasso_shadow" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3584e4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Essential Window 1 (Back, Neutral) -->
  <g filter="url(#card_shadow)">
    <rect x="22" y="24" width="54" height="40" rx="8" fill="url(#win_back)" stroke="#c0bfbc" stroke-width="0.8"/>
    <!-- Clean Minimal Header Strip -->
    <rect x="30" y="30" width="16" height="3" rx="1.5" fill="#9a9996" opacity="0.4"/>
  </g>

  <!-- Essential Window 2 (Front, Selected with Accent Border) -->
  <g filter="url(#card_shadow)">
    <rect x="50" y="42" width="58" height="44" rx="9" fill="url(#win_front)" stroke="#3584e4" stroke-width="1.8"/>
    <!-- Clean Minimal Header Strip -->
    <rect x="58" y="49" width="18" height="3" rx="1.5" fill="#3584e4" opacity="0.85"/>
  </g>

  <!-- The Lasso / Marquee Box with Semi-Transparent Shadow -->
  <g filter="url(#lasso_shadow)">
    <!-- Semi-transparent selection fill -->
    <rect x="13" y="15" width="102" height="78" rx="12" fill="#3584e4" fill-opacity="0.14"/>
    
    <!-- Crisp dashed selection border -->
    <rect x="13" y="15" width="102" height="78" rx="12" fill="none" stroke="#3584e4" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Corner Anchor Handles -->
    <circle cx="13" cy="15" r="3" fill="#ffffff" stroke="#3584e4" stroke-width="1.6"/>
    <circle cx="115" cy="15" r="3" fill="#ffffff" stroke="#3584e4" stroke-width="1.6"/>
    <circle cx="13" cy="93" r="3" fill="#ffffff" stroke="#3584e4" stroke-width="1.6"/>
    <circle cx="115" cy="93" r="3" fill="#ffffff" stroke="#3584e4" stroke-width="1.6"/>
  </g>

  <!-- Essential Selection Count Pill [ 2 ] -->
  <g filter="url(#card_shadow)" transform="translate(74, 82)">
    <rect x="0" y="0" width="36" height="18" rx="9" fill="url(#badge_grad)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8"/>
    <rect x="9" y="5.5" width="6" height="6" rx="1" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.75"/>
    <rect x="11.5" y="7.5" width="6" height="6" rx="1" fill="#ffffff"/>
    <text x="21" y="13" font-family="Cantarell, system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">2</text>
  </g>

</svg>